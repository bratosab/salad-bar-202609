<p>Bienvenue {{ name() }}, construis ta salade :</p>

<div class="topping-lists">
  <app-toppings
    [toppings]="toppings()"
    (chooseTopping)="chooseTopping($event)"
    buttonLabel="+1"
  ></app-toppings>

  <div>
    <p>Vos choix ({{ saladService.totalPrice() }}€)</p>
    <app-toppings
      [toppings]="chosenToppings()"
      (chooseTopping)="removeTopping($event)"
      buttonLabel="-1"
    ></app-toppings>
  </div>
</div>
